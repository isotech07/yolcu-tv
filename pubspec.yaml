name: yolcu_tv
description: M3U / Xtream oynatıcı; Tesla tarayıcısına yayın aktarımı.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Oynatıcı (libmpv tabanlı: MKV, HEVC, DTS, gömülü altyazı)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Durum yönetimi
  provider: ^6.1.2

  # Depolama
  path_provider: ^2.1.4

  # Araç ekranı için yerel web sunucusu
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1

  # EPG (XMLTV)
  xml: ^6.5.0

  # Yayın sırasında ekranın kapanmasını engelle
  wakelock_plus: ^1.2.8

  # Cihazdan M3U dosyası içe aktarma
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
